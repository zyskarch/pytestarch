ci:
    autofix_prs: true

repos:
    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.16.10
      hooks:
          - id: ruff-check
            args: [--fix]
          - id: ruff-format

    - repo: https://github.com/pre-commit/mirrors-mypy
      rev: v2.4.0
      hooks:
          - id: mypy
