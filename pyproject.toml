[project]
name = "PyTestArch"
version = "5.1.0"
requires-python = ">=3.11"
description = "Test framework for software architecture based on imports between modules"
authors = [{ name = "zyskarch", email = "zyskarch@gmail.com" }]
maintainers = [{ name = "zyskarch", email = "zyskarch@gmail.com" }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "architecture",
    "test",
]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Testing :: Unit",
]
dependencies = ["networkx>=3.6"]

[project.optional-dependencies]
visualization = ["matplotlib>=3.11"]

[project.urls]
issues = "https://github.com/zyskarch/pytestarch/issues"
documentation = "https://zyskarch.github.io/pytestarch/latest"
repository = "https://github.com/zyskarch/pytestarch"

[dependency-groups]
dev = [
    "zensical==0.0.72",
    "mkdocstrings-python==2.0.8",
    "mike",
    "nox==2026.8.17",
    "pre-commit==4.6.2",
    "pyrefly>=1.4.0,<2",
    "pytest>=9.1.1,<10",
    "types-networkx>=3.6.1,<4",
    "coverage>=7.16.1,<8",
    "ruff>=0.16.8,<0.17",
]

[tool.uv]
default-groups = "all"

[tool.uv.sources]
mike = { git = "https://github.com/squidfunk/mike.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = ["src/pytestarch", "README.md", "LICENSE"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "F",      # Pyflakes
    "E",
    "W",      # Pylint Error, Warning
    "UP",     # pyupgrade
    "FURB",   # refurb
    "S",      # flake8-bandit
    "I",      # isort
    "RUF100", # Unneeded noqa
]
ignore = [
    "E501", # line too long -> handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
    "S101", # assert statement
    "E743", # ambiguous function name
]

[tool.ruff.lint.isort]
known-first-party = ["integration", "resources", "query_language"]

[tool.pyrefly]
project-includes = ["src", "tests", "noxfile.py"]
project-excludes = ["tests/resources"]
search-path = ["src", "tests"]
